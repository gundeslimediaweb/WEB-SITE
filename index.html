let registrationDraft={};function filterLocations(id,q){const el=byId(id);if(!el)return;const needle=q.toLocaleLowerCase('tr').trim();for(const option of el.options){option.hidden=!!needle&&!option.textContent.toLocaleLowerCase('tr').includes(needle)&&!!option.value}if(needle){const match=[...el.options].find(o=>o.value&&!o.hidden);if(match&&[...el.options].filter(o=>o.value&&!o.hidden).length===1){el.value=match.value;el.dispatchEvent(new Event('change'))}}}
// Searchable, touch-friendly, offline province/district selector. No native option hiding.
function locationPicker(kind,label,selected){
 const disabled=kind==='district'&&!registrationDraft.city;
 const hint=kind==='city'?'İl seçmek için dokunun veya arayın':'Önce il seçin';
 return `<div class="field location-field" id="loc-${kind}"><label for="loc-search-${kind}">${label} <span class="required-mark">*</span></label><input type="hidden" name="${kind}" id="${kind}" value="${esc(selected)}"><div class="location-control"><input id="loc-search-${kind}" type="search" autocomplete="off" aria-autocomplete="list" aria-expanded="false" aria-controls="loc-list-${kind}" role="combobox" placeholder="${hint}" value="${esc(selected)}" ${disabled?'disabled':''} onfocus="openLocation('${kind}')" oninput="searchLocation('${kind}')" onkeydown="locationKey(event,'${kind}')"><button type="button" class="location-toggle" aria-label="${label} seçeneklerini aç" ${disabled?'disabled':''} onclick="toggleLocation('${kind}')">⌄</button></div><div class="location-options hidden" id="loc-list-${kind}" role="listbox"></div><p class="location-help" id="loc-help-${kind}">${disabled?'İl seçtikten sonra ilçeler açılır.':kind==='city'?'81 il arasından arayarak seçim yapın.':'Listeden bir ilçe seçin.'}</p></div>`;
}
function locationNames(kind){return (kind==='city'?Object.keys(TURKEY_DISTRICTS):TURKEY_DISTRICTS[byId('city')?.value]||[]).slice().sort((a,b)=>a.localeCompare(b,'tr'))}
function foldTr(s){return String(s||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i')}
function initLocationPickers(){for(const kind of ['city','district']){const v=byId(kind)?.value||'';const search=byId('loc-search-'+kind);if(search)search.value=v;}document.addEventListener('pointerdown',outsideLocation,{capture:true,once:true})}
function outsideLocation(e){if(!e.target.closest('.location-field')){closeLocations()}document.addEventListener('pointerdown',outsideLocation,{capture:true,once:true})}
function closeLocations(){for(const kind of ['city','district']){byId('loc-list-'+kind)?.classList.add('hidden');byId('loc-search-'+kind)?.setAttribute('aria-expanded','false')}}
function openLocation(kind){const search=byId('loc-search-'+kind);if(!search||search.disabled)return;closeLocations();const list=byId('loc-list-'+kind);list.classList.remove('hidden');search.setAttribute('aria-expanded','true');searchLocation(kind,true)}
function toggleLocation(kind){const list=byId('loc-list-'+kind);if(!list)return;if(list.classList.contains('hidden')){byId('loc-search-'+kind)?.focus();openLocation(kind)}else closeLocations()}
function searchLocation(kind,showAll=false){const list=byId('loc-list-'+kind),input=byId('loc-search-'+kind);if(!list||!input||input.disabled)return;list.classList.remove('hidden');input.setAttribute('aria-expanded','true');const query=showAll?'':foldTr(input.value);const values=locationNames(kind).filter(x=>foldTr(x).includes(query));list.innerHTML=values.length?values.map((x,i)=>`<button type="button" role="option" aria-selected="${byId(kind)?.value===x}" class="location-option" onclick="chooseLocation('${kind}',${i})">${esc(x)}</button>`).join(''):'<div class="location-noresult">Sonuç bulunamadı. Farklı bir arama deneyin.</div>';list.dataset.matches=JSON.stringify(values);const help=byId('loc-help-'+kind);if(help)help.textContent=`${values.length} seçenek ${kind==='district'?'— seçili il: '+(byId('city')?.value||''):'— Türkiye illeri'}`;}
function chooseLocation(kind,index){const list=byId('loc-list-'+kind);const choices=JSON.parse(list?.dataset.matches||'[]');const value=choices[index];if(!value)return;byId(kind).value=value;byId('loc-search-'+kind).value=value;if(kind==='city'){registrationDraft.city=value;registrationDraft.district='';byId('district').value='';const ds=byId('loc-search-district');ds.disabled=false;ds.value='';ds.placeholder='İlçe seçmek için dokunun veya arayın';byId('loc-help-district').textContent=`${locationNames('district').length} ilçe seçilebilir.`;}else registrationDraft.district=value;closeLocations();}
function locationKey(event,kind){if(event.key==='Escape'){closeLocations();return}if(event.key==='Enter'){const list=byId('loc-list-'+kind);if(list&&!list.classList.contains('hidden')){const matches=JSON.parse(list.dataset.matches||'[]');if(matches.length===1){event.preventDefault();chooseLocation(kind,0)}else if(matches.length>1){event.preventDefault();list.querySelector('button')?.focus()}}}}
function updateDistricts(){const city=byId('city')?.value||'';const el=byId('district');if(!el)return;el.disabled=!city;el.innerHTML='<option value="">İlçe seçiniz</option>'+(TURKEY_DISTRICTS[city]||[]).slice().sort((a,b)=>a.localeCompare(b,'tr')).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
function registerBack(step){renderAuth('signup',step-1)}function registerStep(f,step){if(step===1){registrationDraft.business=val(f,'business');registrationDraft.sector=val(f,'sector');registrationDraft.businessType=val(f,'businessType');if(!registrationDraft.businessType){toast('İşletme türünü seçin.');return}if(!registrationDraft.business){toast('İşletme adı gerekli.');return}renderAuth('signup',2);return}if(step===2){let phone=val(f,'phone').replace(/\D/g,'');if(phone.startsWith('90'))phone=phone.slice(2);if(phone.length===10)phone='0'+phone;if(!/^05[0-9]{9}$/.test(phone)){toast('Telefon numarası 05xx xxx xx xx biçiminde olmalı.');return}if(!val(f,'firstName')||!val(f,'lastName')){toast('Yetkilinin adı ve soyadı zorunludur.');return}if(!val(f,'city')||!val(f,'district')||!(TURKEY_DISTRICTS[val(f,'city')]||[]).includes(val(f,'district'))){toast('İl ve ilçe seçimi zorunludur.');return}Object.assign(registrationDraft,{firstName:val(f,'firstName'),lastName:val(f,'lastName'),phone,city:val(f,'city'),district:val(f,'district')});renderAuth('signup',3);return}if(step===3){if(val(f,'password').length<8){toast('Parola en az 8 karakter olmalı.');return}if(val(f,'password')!==val(f,'passwordAgain')){toast('Parolalar eşleşmiyor.');return}registrationDraft.password=val(f,'password');registrationDraft.email=val(f,'email');register()}}
function register(){const d=registrationDraft;let name=d.business;if(db.businesses.some(b=>b.name.toLocaleLowerCase('tr')===name.toLocaleLowerCase('tr'))){toast('Bu isimde bir işletme bu tarayıcıda zaten kayıtlı.');renderAuth('signup',1);return}let b={id:uid(),name,sector:d.sector,businessType:d.businessType,firstName:d.firstName,lastName:d.lastName,phone:d.phone,city:d.city,district:d.district,email:d.email,createdAt:day(),active:true,localAccessPassword:d.password};db.businesses.push(b);save();registrationDraft={};currentBusiness=b;toast('İşletme oluşturuldu. Şimdi ilk profilinizi ekleyin.');renderProfiles()}
function login(f){const b=db.businesses.find(x=>x.name.toLocaleLowerCase('tr')===val(f,'business').toLocaleLowerCase('tr'));if(!b){toast('Bu cihazda işletme kaydı bulunamadı.');return}if(!b.active){toast('Bu işletme erişime kapalı.');return}const pw=val(f,'password');if(b.localAccessPassword?b.localAccessPassword!==pw:!db.profiles.some(p=>p.businessId===b.id&&p.password===pw&&p.active)){toast('İşletme parolası hatalı.');return}currentBusiness=b;sessionStorage.setItem('ofis360_business',b.id);renderProfiles()}

function createFirstProfile(){if(all('profiles').length){toast('Yeni personel eklemek için yetkili profil ile giriş yapın.');return}modal('İlk kullanıcı profilini oluştur',`<div class="form-grid">${field('firstName','Ad','text',currentBusiness.firstName||'','required')}${field('lastName','Soyad','text',currentBusiness.lastName||'','required')}</div>${field('profileName','Profil adı','text','','required placeholder=')}${field password','','required minlength="6"')}${sel('role','İlk profil rolü',[['manager','İşletme Yöneticisi'],['sales','Satış Personeli'],['service','Teknik Servis'],['agent','Emlak Danışmanı']], 'manager')}<div class="notice">Profilinizi kendiniz oluşturuyorsunuz. Parolanızı başka personelle paylaşmayın. Bu sürüm yerel prototiptir.</div><p class="hint">Bu profil otomatik oluşturulmaz. Rolü ve parolayı siz belirlersiniz.</p>`,'Profili oluştur',`saveFirstProfile(event.target)`)}
function saveFirstProfile(f){if(all('profiles').length)return;const p={id:uid(),businessId:currentBusiness.id,firstName:val(f,'firstName'),lastName:val(f,'lastName'),profileName:val(f,'profileName'),role:val(f,'role'),password:val(f,'password'),active:true};db.profiles.push(p);save();closeModal();toast('İlk profil oluşturuldu. Giriş yapmak için seçin.');renderProfiles()}
function selectProfile(id){const p=find('profiles',id);if(!p||!p.active)return;modal('Profil doğrulama',`<p><strong>${esc(p.profileName||p.firstName+' '+p.lastName)}</strong> · ${esc(roles[p.role]||p.role)}</p>${field('password','Profil şifresi','password','','required')}`,'Devam et',`verifyProfile(event.target,'${p.id}')`)}function verifyProfile(f,id){const p=find('profiles',id);if(!p||val(f,'password')!==p.password){toast('Profil şifresi yanlış.');return}currentProfile=p;closeModal();page='dashboard';locked=false;log('Oturum açıldı');renderApp();resetIdle()}

function modules(){const sector=currentBusiness.sector;return ['dashboard','customers',...(sector==='realestate'?['properties']:['inventory','sales','services','field']),'tasks','reports','assistant','profiles','settings','founder'].filter(can)}function getNotices(){if(!currentBusiness)return[];const a=[];const add=(id,text,target,critical=false)=>a.push({id,text,target,critical});const st=db.settings[currentBusiness.id]||{};if(!currentBusiness.phone)add('phone','İşletme telefon numarası eksik.','settings',true);if(!currentBusiness.city||!currentBusiness.district)add('city','İl ve ilçe bilgileri eksik.','settings',true);if(!st.address)add('address','İşletme açık adresi henüz tamamlanmadı.','settings');if(!all('profiles').length)add('profiles','Henüz kullanıcı profili oluşturulmadı.','profiles',true);if(!st.backupAcknowledged)add('backup','Yerel verileriniz için düzenli JSON yedeği almayı planlayın.','settings');if(currentBusiness.sector!=='realestate'){const low=all('products').filter(x=>Number(x.qty)<=Number(x.min));if(low.length)add('stock',`${low.length} üründe kritik stok seviyesi var.`,'inventory',true)}const overdue=all('tasks').filter(x=>x.due&&x.due<day()&&x.status!=='Tamamlandı');if(overdue.length)add('tasks',`${overdue.length} gecikmiş görev var.`,'tasks',true);return a}
function notifications(){const notices=getNotices(),events=all('events').filter(x=>!x.assignee||x.assignee===currentProfile.id),unread=events.filter(x=>!x.readBy?.includes(currentProfile.id)).length;return title('Bildirim Merkezi','İşletme uyarıları ve işlem geçmişi',btn('Tümünü okundu işaretle','markAllNotices()'))+`<div class="grid two"><section class="card"><h3>Tamamlanması gerekenler · ${notices.length}</h3>${notices.length?notices.map(n=>`<button class="notice-item ${n.critical?'critical':''}" onclick="go('${n.target}')"><div><strong>${n.critical?'Önemli işlem':'Önerilen işlem'}</strong><p>${esc(n.text)}</p></div><span>Git →</span></button>`).join(''):empty('Eksik işlem bulunmuyor.')}</section><section class="card"><h3>İşlem bildirimleri · ${unread} okunmamış</h3>${events.length?events.map(e=>`<button class="notice-item ${!e.readBy?.includes(currentProfile.id)?'critical':''}" onclick="openEvent('${e.id}')"><div><strong>${esc(e.kind)}</strong><p>${esc(e.text)}</p><small>${new Date(e.createdAt).toLocaleString('tr-TR')}</small></div><span>Görüntüle →</span></button>`).join(''):empty('Henüz işlem bildirimi yok.')}</section></div>`}function markAllNotices(){for(const e of all('events')){if(!e.readBy)e.readBy=[];if(!e.readBy.includes(currentProfile.id))e.readBy.push(currentProfile.id)}save();renderApp();toast('Bildirimler okundu.')}function openEvent(id){let e=all('events').find(x=>x.id===id);if(!e)return;if(!e.readBy)e.readBy=[];if(!e.readBy.includes(currentProfile.id))e.readBy.push(currentProfile.id);save();go(e.target||'notifications')}

function dashboard(){let isRE=currentBusiness.sector==='realestate',tod=day(),sales=all('sales').filter(x=>x.status==='Tamamlandı'),returns=all('returns'),pending=all('tasks').filter(t=>t.status!=='Tamamlandı'),openServices=all('services').filter(x=>!['Teslim edildi','İptal edildi','Teslim Edildi','İptal Edildi'].includes(x.status)),openField=all('fieldJobs').filter(x=>!['Tamamlandı','İptal edildi','Tamamlanamadı'].includes(x.status)),low=all('products').filter(x=>x.qty<=x.min),net=sales.reduce((n,x)=>n+x.total,0)-returns.reduce((n,x)=>n+x.amount,0),metrics=isRE?[['Portföyler',all('properties').length,'Gayrimenkul kayıtları','properties'],['Aktif ilanlar',all('properties').filter(x=>x.status==='Aktif').length,'Aktif portföyler','properties'],['Gösterimler',all('showings').filter(x=>x.date>=tod).length,'Yaklaşan gösterimler','properties'],['Hatırlatmalar',pending.length,'Tamamlanmamış işler','tasks'],['Müşteriler',all('customers').length,'Müşteri kayıtları','customers']]:[['Net satış',money(net),'İadeler düşülmüştür','sales'],['Bugünkü satış',money(sales.filter(x=>x.date===tod).reduce((n,x)=>n+x.total,0)),'Bugün kaydedilen satışlar','sales'],['Müşteriler',all('customers').length,'Toplam müşteri','customers'],['Açık servis',openServices.length,'Bekleyen cihazlar','services'],['Saha işleri',openField.length,'Devam eden işler','field'],['Kritik stok',low.length,'Minimum seviyedeki ürünler','inventory'],['İadeler',returns.length,'İade geçmişi','sales'],['Hatırlatmalar',pending.length,'Açık görevler','tasks']];return title('Genel Bakış','İşletmenizin güncel çalışma özeti',btn('Yeni müşteri','editCustomer()','')+(!isRE?btn('Yeni satış','newSale()',''):''))+`<div class="notice">Yerel çalışma alanı · Veriler bu tarayıcıda saklanır. Düzenli JSON yedeği alın.</div><div class="metric-grid">${metrics.filter(m=>can(m[3])).map(m=>`<button class="card metric metric-action" onclick="go('${m[3]}')"><div class="label">${m[0]}</div><div class="value">${m[1]}</div><div class="detail">${m[2]} <span>↗</span></div></button>`).join('')}</div><div class="grid two section-space"><section class="card"><h3>Yaklaşan hatırlatmalar</h3>${pending.sort((a,b)=>(a.due||'').localeCompare(b.due||'')).slice(0,6).map(t=>`<button class="list-row row-action" onclick="go('tasks')"><div><strong>${esc(t.title)}</strong><div class="hint">${fmt(t.due)} · ${esc(profileName(t.assignee))}</div></div>${status(t.due<tod?'Gecikmiş':t.status)}</button>`).join('')||empty('Açık hatırlatma bulunmuyor.')}</section><section class="card"><h3>Son işlemler</h3>${all('activity').slice(0,7).map(a=>`<div class="list-row"><div>${esc(a.text)}<div class="hint">${new Date(a.date).toLocaleString('tr-TR')}</div></div></div>`).join('')||empty('Henüz işlem yapılmadı.')}</section></div>`}
function customers(){let rows=filterRows(all('customers'),['name','phone','email','type']);return title('Müşteriler','Müşteri bilgileri ve iletişim kayıtları',btn('Yeni müşteri',"editCustomer()",''))+searchBar()+table(['Müşteri','Telefon','E-posta','Tür','Takip tarihi','İşlem'],rows.map(c=>[esc(c.name),esc(c.phone),esc(c.email),esc(c.type),fmt(c.follow),btn('Düzenle',`editCustomer('${c.id}')`)]))}function editCustomer(id='',fromService=false){const c=find('customers',id)||{};modal(id?'Müşteriyi düzenle':'Yeni müşteri',`<div class="form-grid">${field('name','Ad soyad / firma','text',c.name,'required')}${field('phone','Telefon','tel',c.phone)}${field('email','E-posta','email',c.email)}${sel('type','Müşteri türü',[['Bireysel','Bireysel'],['Kurumsal','Kurumsal'],['Mülk Sahibi','Mülk Sahibi'],['Alıcı / Kiracı','Alıcı / Kiracı']],c.type||'Bireysel')}${field('follow','Sonraki takip','date',c.follow)}${field('address','Adres','text',c.address)}${area('notes','Notlar',c.notes)}</div>`,'Kaydet',`saveCustomer(event.target,'${id}',${fromService})`)}function saveCustomer(f,id,fromService){let name=val(f,'name'),phone=val(f,'phone');if(!id&&phone&&all('customers').some(c=>c.phone===phone)){toast('Bu telefon numarasıyla kayıtlı müşteri var.');return}let c=id?find('customers',id):{id:uid(),businessId:currentBusiness.id};Object.assign(c,{name,phone,email:val(f,'email'),type:val(f,'type'),follow:val(f,'follow'),address:val(f,'address'),notes:val(f,'notes')});if(!id)db.customers.push(c);log((id?'Müşteri güncellendi: ':'Müşteri eklendi: ')+name);closeModal();if(fromService){serviceDraft.customerId=c.id;editService(serviceDraft._id||'',true)}else renderApp();toast('Müşteri kaydedildi')}

function assistant(){let suggestions=[],tod=day();if(currentBusiness.sector!=='realestate'){for(let p of all('products').filter(p=>p.qty<=p.min))suggestions.push(['Kritik stok: '+p.name,`Mevcut stok ${p.qty}, belirlenen eşik ${p.min}. Tedarik ihtiyacını kontrol edin.`]);for(let s of all('services').filter(s=>s.due&&s.due<tod&&!['Teslim edildi','İptal edildi','Teslim Edildi','İptal Edildi'].includes(s.status)))suggestions.push(['Geciken servis: '+s.number,'Tahmini teslim tarihi geçti. Müşteriyle iletişime geçin.'])}for(let t of all('tasks').filter(t=>t.due&&t.due<tod&&t.status!=='Tamamlandı'))suggestions.push(['Geciken görev: '+t.title,'Görevin bitiş tarihi geçti.']);for(let c of all('customers').filter(c=>c.follow&&c.follow<=tod))suggestions.push(['Müşteri takibi: '+c.name,'Takip tarihi geldi veya geçti.']);return title('Akıllı Rehber','İşletme kayıtlarından üretilen kural tabanlı öneriler')+`<div class="notice">Bu modül haricî yapay zekâ değildir. Öneriler yalnızca tanımlı kurallara dayanır.</div><div class="card"><h3>Öneriler (${suggestions.length})</h3>${suggestions.length?suggestions.map(s=>`<div class="list-row"><div><strong>${esc(s[0])}</strong><div class="muted compact">${esc(s[1])}</div></div></div>`).join(''):empty('Şu anda uyarı oluşturacak yeterli kayıt bulunmuyor.')}</div>`}
function profiles(){return title('Personel ve Profiller','İşletmeye bağlı yerel kullanıcı profilleri',btn('Yeni personel','editProfile()',''))+table(['Personel','E-posta','Rol','Durum','İşlem'],all('profiles').map(p=>[esc(p.firstName+' '+p.lastName),esc(p.email),esc(roles[p.role]||p.role),status(p.active?'Aktif':'Pasif'),btn('Düzenle',`editProfile('${p.id}')`)]))}function editProfile(id=''){let p=find('profiles',id)||{};modal(id?'Profili düzenle':'Yeni personel',`<div class="form-grid">${field('firstName','Ad','text',p.firstName,'required')}${field('lastName','Soyad','text',p.lastName,'required')}${field('email','E-posta','email',p.email)}${sel('role','Rol',Object.entries(roles).filter(x=>x[0]!=='owner'||p.role==='owner'),p.role||'sales')}${field('password','Yerel profil şifresi','password','',''+(id?'':'required minlength="6"'))}${sel('active','Durum',[['true','Aktif'],['false','Pasif']],String(p.active??true))}</div><p class="hint">Yerel prototipte profil şifreleri güvenli saklanmaz. Gerçek parolalar kullanmayın.</p>`,'Kaydet',`saveProfile(event.target,'${id}')`)}function saveProfile(f,id){let p=id?find('profiles',id):{id:uid(),businessId:currentBusiness.id};if(id===currentProfile.id&&val(f,'active')==='false'){toast('Kendi profilinizi devre dışı bırakamazsınız.');return}if(p.role==='owner'&&val(f,'role')!=='owner'){toast('İşletme sahibi rolü bu ekrandan değiştirilemez.');return}for(let k of ['firstName','lastName','email','role'])p[k]=val(f,k);if(val(f,'password'))p.password=val(f,'password');p.active=val(f,'active')==='true';if(!id)db.profiles.push(p);log('Personel profili kaydedildi');closeModal();renderApp()}
function settings(){let s=db.settings[currentBusiness.id]||{};return title('İşletme Ayarları','Çalışma alanı tercihleri')+`<div class="card"><form id="settings-form" onsubmit="event.preventDefault();saveSettings(event.target)"><div class="form-grid">${field('name','İşletme adı','text',currentBusiness.name,'required')}${field('idle','Hareketsizlik kilidi (dakika)','number',s.idle||10,'min="1" max="120"')}${field('phone','İşletme telefonu','tel',currentBusiness.phone||s.phone)}${field('address','Adres','text',s.address)}${sel('city','İl',[['','İl seçiniz'],...Object.keys(TURKEY_DISTRICTS).sort((a,b)=>a.localeCompare(b,'tr')).map(x=>[x,x])],currentBusiness.city||'')}${sel('district','İlçe',[['','İlçe seçiniz'],...(TURKEY_DISTRICTS[currentBusiness.city]||[]).sort((a,b)=>a.localeCompare(b,'tr')).map(x=>[x,x])],currentBusiness.district||'')}${field('receipt','Fiş alt bilgisi','text',s.receipt)}<label class="consent"><input type="checkbox" name="backupAcknowledged" ${s.backupAcknowledged?'checked':''}> Yerel yedekleme sorumluluğunu okudum</label></div><button class="btn" type="submit">Ayarları kaydet</button></form></div><div class="card section-space"><h3>Yerel veri yönetimi</h3><p class="muted">Yedek tarayıcı verilerinin JSON kopyasıdır; sunucu yedeği değildir. Yükleme mevcut yerel verileri değiştirebilir.</p><div class="actions">${btn('JSON yedeği indir','exportBackup()','')}${btn('Yedeği geri yükle','byId(\'backup-file\').click()')}<input id="backup-file" class="hidden" type="file" accept=".json,application/json" onchange="importBackup(event)"></div></div>`}function saveSettings(f){if(val(f,'city')&&!(TURKEY_DISTRICTS[val(f,'city')]||[]).includes(val(f,'district'))){toast('Seçtiğiniz ile ait geçerli bir ilçe seçin.');return}currentBusiness.name=val(f,'name');currentBusiness.phone=val(f,'phone');currentBusiness.city=val(f,'city');currentBusiness.district=val(f,'district');db.settings[currentBusiness.id]={idle:Math.max(1,Math.min(120,number(f,'idle')||10)),phone:val(f,'phone'),address:val(f,'address'),receipt:val(f,'receipt'),backupAcknowledged:!!f.elements.backupAcknowledged?.checked};log('İşletme ayarları güncellendi');renderApp();toast('Ayarlar kaydedildi')}function exportBackup(){download('Ofis360_Yedek_'+day()+'.json',new Blob([JSON.stringify(db,null,2)],{type:'application/json'}))}async function importBackup(e){let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.businesses)||!Array.isArray(data.profiles)||!Array.isArray(data.customers)||!Array.isArray(data.products)||!Array.isArray(data.sales)){toast('Geçersiz yedek yapısı.');return}let old=JSON.stringify(db);if(!confirm('Yerel veriler değiştirilecek. Devam edilsin mi?'))return;download('Ofis360_Otomatik_Onceki_Yedek.json',new Blob([old],{type:'application/json'}));db={...load(),...data};save();logoutAll();toast('Yedek yüklendi. Tekrar giriş yapın.')}catch{toast('Dosya okunamadı.')}}

const RECORD_PREFIX={businesses:'ISL',profiles:'PRS',customers:'MUS',products:'URN',sales:'SAT',returns:'IAD',services:'SRV',fieldJobs:'SAH',tasks:'HTR',orders:'SIP',properties:'EML',stockMoves:'STK',serviceParts:'PRC',showings:'GST'};
const TRACKED_COLLECTIONS=Object.keys(RECORD_PREFIX);
function ensureCollections(){for(const k of TRACKED_COLLECTIONS)if(!Array.isArray(db[k]))db[k]=[];if(!Array.isArray(db.usedNumbers))db.usedNumbers=[];if(!Array.isArray(db.licenseHistory))db.licenseHistory=[];if(!db.licenses||typeof db.licenses!=='object')db.licenses={};}
function newRecordNumber(type){ensureCollections();const prefix=RECORD_PREFIX[type]||'KYT';let code;let used=new Set(db.usedNumbers);for(const k of TRACKED_COLLECTIONS)for(const r of db[k])if(r.number)used.add(r.number);do{let b=new Uint8Array(5);if(globalThis.crypto?.getRandomValues)crypto.getRandomValues(b);else for(let i=0;i<b.length;i++)b[i]=Math.random()*256|0;code=prefix+'-'+[...b].map(n=>n.toString(16).padStart(2,'0')).join('').toUpperCase()}while(used.has(code));db.usedNumbers.push(code);return code;}
function stampRecord(r){if(!r||!currentProfile||!currentBusiness||r.businessId!==currentBusiness.id)return;if(!r.createdById){r.createdById=currentProfile.id;r.createdByName=[currentProfile.firstName,currentProfile.lastName].filter(Boolean).join(' ');r.createdAt=r.createdAt||new Date().toISOString();}}
const originalSave=save;
save=function(){ensureCollections();for(const [type,prefix] of Object.entries(RECORD_PREFIX))for(const r of db[type]){if(!r.number)r.number=newRecordNumber(type)}return originalSave()};
const originalLog=log;
log=function(text){if(!currentBusiness)return;ensureCollections();db.activity.unshift({id:uid(),businessId:currentBusiness.id,profileId:currentProfile?.id||null,profileName:currentProfile?[currentProfile.firstName,currentProfile.lastName].join(' '):'Sistem',text,date:new Date().toISOString()});db.activity=db.activity.slice(0,1000);save()};
function brandMark(cls=''){return `<img class="${cls}" src="${OFIS_LOGO}" alt="Gündeşli Soft G logosu">`}
function clearLocalSession(){sessionStorage.removeItem('ofis360_v8_session');sessionStorage.removeItem('ofis360_v8_locked')}
function persistLocalSession(isLocked=false){if(!currentBusiness||!currentProfile)return;sessionStorage.setItem('ofis360_v8_session',JSON.stringify({businessId:currentBusiness.id,profileId:currentProfile.id,page}));sessionStorage.setItem('ofis360_v8_locked',isLocked?'1':'0')}
function unlockV8(f){if(!currentProfile||!currentBusiness)return;const pw=val(f,'password');if(pw!==currentProfile.password){byId('lock-error-v8').textContent='Şifre yanlış. Lütfen tekrar deneyin.';f.elements.password.value='';f.elements.password.focus();return}locked=false;sessionStorage.setItem('ofis360_v8_locked','0');renderApp();resetIdle();toast('Oturum açıldı')}
function switchFromLockV8(){clearTimeout(idleTimer);clearLocalSession();locked=false;currentProfile=null;$('#modal-root').innerHTML='';renderProfiles()}
lockSession=function(){if(!currentProfile||locked)return;clearTimeout(idleTimer);renderLockV8()};
unlock=function(f){unlockV8(f)};
const originalRenderApp=renderApp;
renderApp=function(){if(locked)return renderLockV8();originalRenderApp();if(currentBusiness&&currentProfile){const b=$('.sidebar .brand .mark');if(b)b.innerHTML=brandMark();const top=$('.topbar .actions');if(top&&!byId('v8-quicklock'))top.insertAdjacentHTML('beforeend','<button id="v8-quicklock" class="btn ghost small" onclick="lockSession()">Oturumu kilitle</button>')}};
const originalGo=go;
go=function(p){if(locked)return renderLockV8();return originalGo(p)};
const originalLogoutAll=logoutAll;
logoutAll=function(){clearLocalSession();locked=false;return originalLogoutAll()};
const originalLogoutProfile=logoutProfile;
logoutProfile=function(){clearLocalSession();locked=false;return originalLogoutProfile()};
const originalVerifyProfile=verifyProfile;
verifyProfile=function(f,id){originalVerifyProfile(f,id);if(currentProfile&&!locked)persistLocalSession(false)};
renderProfiles=function(){if(!currentBusiness)return renderAuth();const rows=all('profiles').filter(p=>p.active);$('#modal-root').innerHTML='';$('#root').innerHTML=`<section class="profile-v8"><div class="profile-stage"><div class="brand"><div class="mark">${brandMark()}</div><div>GÜNDEŞLİ SOFT<small>OFİS360</small></div></div><h1>Kim çalışıyor?</h1><p class="subtitle">${esc(currentBusiness.name)} · ${esc(sectors[currentBusiness.sector]||'İşletme')}<br>${rows.length?'Devam etmek için profilinizi seçin.':'İşletmenizi kullanmaya başlamak için ilk profili oluşturun.'}</p><div class="auth-profile">${rows.map(p=>`<button class="profile-card" type="button" onclick="selectProfile('${p.id}')"><div class="avatar">${esc((p.firstName||'?')[0])}${esc((p.lastName||'')[0])}</div><strong>${esc(p.profileName||[p.firstName,p.lastName].join(' '))}</strong><span class="role">${esc(roles[p.role]||p.role)}</span></button>`).join('')}${rows.length?'':`<button class="profile-card add-profile" type="button" onclick="createFirstProfile()"><div class="avatar">+</div><strong>İlk profili oluştur</strong><span class="role">Yetki ve şifre belirle</span></button>`}</div>${rows.length?'<button class="profile-manage" onclick="showProfileManageInfo()">PROFİLLERİ YÖNET</button>':''}<div class="profile-bottom"><button class="btn ghost" onclick="logoutAll()">İşletmeden çıkış</button></div></div></section>`};
function showProfileManageInfo(){modal('Profil yönetimi',`<p>Personel ekleme ve düzenleme için yetkili bir profile giriş yapın. Ardından <strong>Personel ve Profiller</strong> bölümünü açın.</p>`,'Tamam','closeModal()')}

  if(hasPin)pin360Bind();else setTimeout(()=>byId('pin360-legacy')?.focus(),50)

function pin360Bind(){const items=[...document.querySelectorAll('.pin360-digit')];items.forEach((el,i)=>{
 el.addEventListener('input',()=>{let raw=el.value.replace(/\D/g,'');if(raw.length>1){raw.slice(0,items.length-i).split('').forEach((v,j)=>items[i+j].value=v);items[Math.min(items.length-1,i+raw.length-1)].focus()}else{el.value=raw.slice(-1);if(el.value&&i<items.length-1)items[i+1].focus()}if(items.every(x=>x.value))byId('pin360-form')?.requestSubmit()});
 el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&i>0){items[i-1].value='';items[i-1].focus()}if(e.key==='ArrowLeft'&&i>0)items[i-1].focus();if(e.key==='ArrowRight'&&i<items.length-1)items[i+1].focus()});
 el.addEventListener('paste',e=>{e.preventDefault();const pasted=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,items.length);pasted.split('').forEach((v,j)=>items[j].value=v);items[Math.min(pasted.length,items.length-1)]?.focus();if(pasted.length===items.length)byId('pin360-form')?.requestSubmit()})
 });items[0]?.focus()}

 if((p.pin360&&code!==p.pin360)||(!p.pin360&&code!==p.password)){pin360Attempts++;const e=byId('pin360-error');if(e)e.textContent=pin360Attempts>=5?'Çok sayıda hatalı giriş. Bir süre bekleyip tekrar deneyin.':'Kod veya şifre yanlış. Tekrar deneyin.';document.querySelectorAll('.pin360-digit').forEach(x=>x.value='');if(byId('pin360-legacy'))byId('pin360-legacy').value='';if(pin360Attempts>=5){const button=document.querySelector('.pin360-submit');if(button){button.disabled=true;setTimeout(()=>{button.disabled=false;pin360Attempts=0},30000)}}document.querySelector('.pin360-digit')?.focus();return}
 pin360Attempts=0;

}

12-foot{margin:28px 0 4px;color:#8793a5;font-size:11px}.app .v12-date{font-size:11px;color:#718299}.app .profile-mini strong{color:white}body:has(.app) .modal{border-radius:14px;max-width:860px;font-family:'Segoe UI',Arial,sans-serif}body:has(.app) .modal-header{background:#f8fafc}body:has(.app) .modal-body{max-height:72vh;overflow:auto}body:has(.app) .modal .field input,body:has(.app) .modal select,body:has(.app) .modal textarea{border-radius:7px}body:has(.app) .modal .v12-list{padding:12px;border-bottom:1px solid #e2e7ee}.app .v12-density-compact td{padding:9px 12px}@media(max-width:1150px){.app .metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app .v12-panels{grid-template-columns:1fr}.app .content{padding:24px}}@media(max-width:900px){.app .main{margin-left:0}.app .sidebar{transform:translateX(-100%)}.app .sidebar.open{transform:translateX(0)}.app .hamburger{display:inline-flex}}@media(max-width:600px){.app .content{padding:18px 12px}.app .topbar{padding:12px}.app .metric-grid{gap:10px}.app .metric{padding:14px}.app .metric .value{font-size:22px}.app .v12-hero{padding:20px;align-items:flex-start;flex-direction:column}.app .quick-actions{grid-template-columns:repeat(2,1fr)}.app .page-head{align-items:flex-start;gap:12px}.app .v12-date{display:none}}@media print{.app .sidebar,.app .topbar,.app .btn,.app .v12-tabs{display:none!important}.app .main{margin:0}.app .content{padding:0}.app .card{break-inside:avoid}}

<script>/* OFIS360 v12: authenticated workspace only. Existing authentication code is unchanged. */
let v12Filter='',v12Period='month';
const v12Sum=(rows,key)=>rows.reduce((a,x)=>a+(Number(x[key])||0),0);
const v12Manager=()=>['owner','manager'].includes(currentProfile?.role);
function v12Ensure(){for(const k of ['expenses','income','orders','customerNotes','priceHistory'])if(!Array.isArray(db[k]))db[k]=[]}
function v12Guard(module){if(locked||!currentProfile||!can(module)){toast('Bu işlem için yetkiniz yok.');return false}return true}
const v12OldCan=can;can=function(p){if(p==='finance')return !!currentProfile&&v12Manager();if(p==='orders')return v12OldCan('sales');return v12OldCan(p)};
labels.finance='Gelir ve Gider';labels.orders='Siparişler';labels.tasks='Görevler ve Hatırlatmalar';icons.finance='₺';icons.orders='▣';
const v12Modules=modules;modules=function(){let a=v12Modules().filter(x=>x!=='founder');if(can('finance'))a.splice(a.indexOf('reports'),0,'finance');if(currentBusiness.sector!=='realestate'&&can('orders'))a.splice(a.indexOf('sales')+1,0,'orders');return a};
const v12Go=go;go=function(p){v12Filter='';return v12Go(p)};
function v12Select(module,filter){if(!can(module))return;v12Filter=filter;page=module;search='';renderApp()}
const v12Render=renderApp;renderApp=function(){if(currentBusiness&&currentProfile&&!locked)v12Ensure();v12Render();if(!currentProfile||locked||!$('.app'))return;let top=$('.topbar .actions:last-child');if(top){top.insertAdjacentHTML('afterbegin',`<span class="v12-date">${new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</span>${btn('+ Hızlı işlem','v12QuickModal()','')}${can('settings')?btn('Ayarlar',"go('settings')"):''}`)}$('.profile-mini .btn')?.setAttribute('aria-label','Profil değiştir');let pbtn=$('.profile-mini .btn');if(pbtn)pbtn.textContent='Değiştir';byId('v8-quicklock')?.remove();$('.content').classList.toggle('v12-density-compact',db.settings[currentBusiness.id]?.density==='compact');$('.content').insertAdjacentHTML('beforeend','<div class="v12-foot">GÜNDEŞLİ SOFT · OFİS360 &nbsp; / &nbsp; Veriler bu tarayıcıda saklanır.</div>')};
const v12Page=renderPage;renderPage=function(){if(page==='finance')return v12Finance();if(page==='orders')return v12Orders();return v12Page()};
function v12Card(label,value,hint,module,filter='',symbol='↗'){return `<button class="card metric metric-action ${page===module&&v12Filter===filter?'selected':''}" onclick="v12Select('${module}','${filter}')"><span class="v12-symbol">${symbol}</span><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="detail">${esc(hint)}<span>↗</span></div></button>`}
function v12Cards(items){return '<div class="metric-grid">'+items.filter(x=>can(x[3])).map(x=>v12Card(...x)).join('')+'</div>'}
function v12Tabs(items,module){return `<div class="v12-tabs">${items.map(([k,t])=>btn(t,`v12Select('${module}','${k}')`,'ghost '+(v12Filter===k?'selected':''))).join('')}</div>`}
function v12Range(){let d=new Date(),end=day(),start=end;if(v12Period==='week'){d.setDate(d.getDate()-6);start=d.toLocaleDateString('sv-SE')}if(v12Period==='month')start=end.slice(0,7)+'-01';if(v12Period==='year')start=end.slice(0,4)+'-01-01';if(v12Period==='all')start='0000';return [start,end]}
function v12Within(x,start,end){return (x.date||x.createdAt||'').slice(0,10)>=start&&(x.date||x.createdAt||'').slice(0,10)<=end}
function v12Totals(start,end){const sales=all('sales').filter(x=>x.status==='Tamamlandı'&&v12Within(x,start,end)),returns=all('returns').filter(x=>v12Within(x,start,end)),income=v12Sum(sales,'total')-v12Sum(returns,'amount')+v12Sum(all('income').filter(x=>v12Within(x,start,end)),'amount'),expense=v12Sum(all('expenses').filter(x=>v12Within(x,start,end)),'amount');return {income,expense,net:income-expense,sales}}
function v12PeriodControl(){return `<select aria-label="Rapor dönemi" onchange="v12Period=this.value;renderApp()">${[['day','Bugün'],['week','Son 7 gün'],['month','Bu ay'],['year','Bu yıl'],['all','Tüm zamanlar']].map(([k,v])=>`<option value="${k}" ${v12Period===k?'selected':''}>${v}</option>`).join('')}</select>`}
function v12Quick(){let a=[['Yeni müşteri','customers','editCustomer()'],['Yeni satış','sales','newSale()'],['Yeni ürün','inventory','editProduct()'],['Cihaz kabul','services','editService()'],['Yeni görev','tasks','editTask()'],['Gider ekle','finance',"v12MoneyEdit('expenses')"],['Yeni portföy','properties','editProperty()']];return '<div class="quick-actions">'+a.filter(x=>modules().includes(x[1])).map(x=>`<button class="quick-action" onclick="closeModal();${x[2]}">＋ &nbsp;${x[0]} <span style="float:right">↗</span></button>`).join('')+'</div>'}
function v12QuickModal(){modal('Hızlı işlemler',v12Quick(),'','')}
function v12Chart(mode='daily'){let points=[];for(let i=mode==='daily'?6:5;i>=0;i--){let d=new Date();if(mode==='daily')d.setDate(d.getDate()-i);else d.setMonth(d.getMonth()-i,1);let key=d.toLocaleDateString('sv-SE'),start=mode==='daily'?key:key.slice(0,7)+'-01',end=mode==='daily'?key:key.slice(0,7)+'-31';points.push({label:mode==='daily'?d.toLocaleDateString('tr-TR',{weekday:'short'}):d.toLocaleDateString('tr-TR',{month:'short'}),...v12Totals(start,end)})}let max=Math.max(1,...points.flatMap(x=>[Math.abs(x.income),x.expense]));return `<div class="v12-bars" role="img" aria-label="${mode==='daily'?'Son yedi gün':'Son altı ay'} gelir gider grafiği">${points.map(x=>`<div class="v12-barcol"><div class="v12-bar" style="height:${Math.max(1,Math.max(0,x.income)/max*100)}%" title="Gelir: ${money(x.income)}"></div><div class="v12-bar expense" style="height:${Math.max(1,x.expense/max*100)}%" title="Gider: ${money(x.expense)}"></div><span>${x.label}</span></div>`).join('')}</div><p class="hint">● Gelir (mavi) &nbsp; ● Gider (yeşil) · İadeler gelirden düşülür.</p>`}
function v12MyTasks(){return all('tasks').filter(t=>v12Manager()||t.assignee===currentProfile.id)}
dashboard=function(){const tod=day(),range=v12Range(),t=v12Totals(...range),today=v12Totals(tod,tod);let yd=new Date();yd.setDate(yd.getDate()-1);const yesterday=v12Totals(yd.toLocaleDateString('sv-SE'),yd.toLocaleDateString('sv-SE')),diff=today.income-yesterday.income,pending=v12MyTasks().filter(t=>t.status!=='Tamamlandı'),re=currentBusiness.sector==='realestate';const metrics=[['Günlük satışlar',money(v12Sum(today.sales,'total')),today.sales.length+' satış · Düne göre '+money(diff),'sales','today'],['Toplam gelir',money(t.income),'Seçilen dönem · İadeler düşülmüş','finance','income'],['Toplam gider',money(t.expense),'Kayıtlı işletme giderleri','finance','expenses'],['Net kazanç',money(t.net),'Kayıtlı gelir − gider','finance','net'],['Toplam müşteri',all('customers').length,'Müşteri ilişkileri ve takip','customers'],[re?'Aktif portföyler':'Ürün ve stok',re?all('properties').filter(x=>x.status==='Aktif').length:all('products').length,re?'Satılık ve kiralık kayıtlar':all('products').filter(p=>p.qty<=p.min).length+' kritik ürün · '+money(all('products').reduce((s,p)=>s+p.qty*p.cost,0)),re?'properties':'inventory'],['Bekleyen görevler',pending.length,pending.filter(t=>t.due&&t.due<tod).length+' geciken görev','tasks','pending'],['Personel durumu',all('profiles').filter(p=>p.active).length,'Aktif ekip ve işlem performansı','profiles']];return title('Genel Bakış','İşletmenizin çalışma merkezi',v12PeriodControl())+`<div class="v12-hero"><div><div class="v12-kicker">ÇALIŞMA ALANINIZ</div><h2>Merhaba, ${esc(currentProfile.firstName)}.</h2><p>${esc(currentBusiness.name)} · Bugünün işlerini tek yerden yönetin.</p></div>${btn('+ Hızlı işlem','v12QuickModal()','')}</div>`+v12Cards(metrics.filter(x=>!re||x[3]!=='sales'))+`<div class="v12-panels">${can('finance')?`<section class="card"><div class="v12-panelhead"><h3>Gelir ve gider görünümü</h3>${btn('Analizler',"go('reports')")}</div>${v12Chart()}<p class="hint">Kazanç yalnızca kaydettiğiniz gelir ve giderlerden hesaplanır; muhasebe kârı değildir.</p></section>`:`<section class="card"><h3>Hızlı işlemler</h3>${v12Quick()}</section>`}<section class="card"><div class="v12-panelhead"><h3>İşlem bekleyenler</h3>${btn('Bildirimler',"go('notifications')")}</div>${[['Açık teknik servisler',all('services').filter(x=>!['Teslim edildi','İptal edildi','Teslim Edildi','İptal Edildi'].includes(x.status)).length,'services'],['Bekleyen siparişler',all('orders').filter(x=>!['Teslim Edildi','İptal Edildi'].includes(x.status)).length,'orders'],['Müşteri geri dönüşleri',all('customers').filter(x=>x.follow&&x.follow<=tod).length,'customers'],['Yaklaşan görevler',pending.filter(t=>t.due>=tod).length,'tasks']].filter(x=>modules().includes(x[2])).map(x=>`<button class="list-row row-action" onclick="v12Select('${x[2]}','pending')"><span>${x[0]}</span><strong>${x[1]} →</strong></button>`).join('')}</section><section class="card"><div class="v12-panelhead"><h3>Hatırlatmalar</h3>${btn('Tüm görevler',"go('tasks')")}</div>${pending.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,5).map(t=>`<button class="list-row row-action" onclick="editTask('${t.id}')"><div><strong>${esc(t.title)}</strong><div class="hint">${fmt(t.due)} · ${esc(profileName(t.assignee))}</div></div>${status(t.due&&t.due<tod?'Gecikmiş':t.status)}</button>`).join('')||empty('Açık görev bulunmuyor.')}</section><section class="card"><div class="v12-panelhead"><h3>Son işlemler</h3>${can('reports')?btn('Tümü','recordAudit()'):''}</div>${all('activity').filter(x=>v12Manager()||x.profileId===currentProfile.id).slice(0,5).map(x=>`<div class="v12-list"><div>${esc(x.text)}<small>${esc(x.profileName||profileName(x.profileId))} · ${new Date(x.date).toLocaleString('tr-TR')}</small></div></div>`).join('')||empty('İşlem yapıldıkça geçmiş burada görünür.')}</section></div><section class="card section-space"><h3>Hızlı işlemler</h3>${v12Quick()}</section>`};
function v12MoneyEdit(kind,id=''){if(!v12Guard('finance'))return;const r=find(kind,id)||{};modal(kind==='expenses'?'Gider kaydı':'Gelir kaydı',`<div class="form-grid">${field('title','Açıklama','text',r.title,'required')}${field('amount','Tutar (₺)','number',r.amount||'','required min="0.01" step="0.01"')}${field('category','Kategori / kaynak','text',r.category||'Diğer','required')}${field('date','Tarih','date',r.date||day(),'required')}${sel('customerId','İlgili müşteri',optionList(all('customers')),r.customerId)}${area('notes','Notlar',r.notes)}</div>`,'Kaydet',`v12MoneySave(event.target,'${kind}','${id}')`)}
function v12MoneySave(f,kind,id){if(!v12Guard('finance')||!['income','expenses'].includes(kind))return;const amount=number(f,'amount');if(!Number.isFinite(amount)||amount<=0)return toast('Geçerli bir tutar girin.');let r=find(kind,id);if(id&&!r)return;if(!r){r={id:uid(),businessId:currentBusiness.id,createdAt:new Date().toISOString(),profileId:currentProfile.id};db[kind].push(r)}for(let k of ['title','category','date','notes','customerId'])r[k]=val(f,k);r.amount=amount;log((kind==='income'?'Gelir':'Gider')+' kaydedildi: '+r.title);closeModal();renderApp()}
function v12DeleteMoney(kind,id){if(!v12Guard('finance'))return;confirmAction('Bu finans kaydı silinsin mi?',`v12DeleteMoneyConfirmed('${kind}','${id}')`)}
function v12DeleteMoneyConfirmed(kind,id){if(!v12Guard('finance')||!['income','expenses'].includes(kind))return;const r=find(kind,id);if(!r)return;db[kind]=db[kind].filter(x=>x!==r);log('Finans kaydı silindi: '+r.title);closeModal();renderApp()}
function v12Finance(){const [start,end]=v12Range(),t=v12Totals(start,end),kind=v12Filter==='expenses'?'expenses':'income';const rows=filterRows(all(kind).filter(x=>v12Within(x,start,end)),['title','category']);return title('Gelir ve Gider','Satış geliri otomatik, diğer gelir ve giderler kayıtlarınızdan hesaplanır.',v12PeriodControl()+btn('+ Gelir',"v12MoneyEdit('income')")+btn('+ Gider',"v12MoneyEdit('expenses')",''))+v12Cards([['Toplam gelir',money(t.income),'Satış − iade + diğer gelir','finance','income'],['Toplam gider',money(t.expense),'Kaydedilen giderler','finance','expenses'],['Net kazanç',money(t.net),'Gelir − gider','finance','net']])+v12Tabs([['income','Diğer gelirler'],['expenses','Giderler'],['net','Kazanç analizi']],'finance')+(v12Filter==='net'?`<div class="card">${v12Chart('monthly')}<p class="hint">Stok alışları, ürün maliyetleri ve servis ücretleri otomatik gider/gelir yazılmaz. İlgili kayıtları burada ekleyin; aynı tutarı iki kez kaydetmeyin.</p></div>`:searchBar()+table(['Tarih','Açıklama','Kategori','Tutar','Personel','İşlem'],rows.map(r=>[fmt(r.date),esc(r.title),esc(r.category),money(r.amount),esc(profileName(r.profileId)),btn('Düzenle',`v12MoneyEdit('${kind}','${r.id}')`)+btn('Sil',`v12DeleteMoney('${kind}','${r.id}')`,'danger')])))}
customers=function(){let rows=filterRows(all('customers'),['name','company','phone','email','city','district','type']);if(v12Filter==='individual')rows=rows.filter(x=>x.type==='Bireysel');if(v12Filter==='corporate')rows=rows.filter(x=>x.type==='Kurumsal');if(v12Filter==='pending')rows=rows.filter(x=>x.follow&&x.follow<=day());if(v12Filter==='recent')rows=rows.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,20);return title('Müşteri Yönetimi','Müşteri ilişkileri, görüşmeler ve işlem geçmişi',btn('Excel’e aktar',"v12Export('customers')")+btn('+ Yeni müşteri','editCustomer()',''))+v12Cards([['Toplam müşteri',all('customers').length,'Tüm müşteri kayıtları','customers'],['Bireysel müşteriler',all('customers').filter(x=>x.type==='Bireysel').length,'Bireysel kayıtları aç','customers','individual'],['Kurumsal müşteriler',all('customers').filter(x=>x.type==='Kurumsal').length,'Firma kayıtlarını aç','customers','corporate'],['Bekleyen geri dönüşler',all('customers').filter(x=>x.follow&&x.follow<=day()).length,'Takip tarihi gelen müşteriler','customers','pending']])+v12Tabs([['','Tümü'],['recent','Son eklenenler'],['pending','Müşteri takibi']],'customers')+searchBar()+table(['Müşteri','İletişim','Tür','Şehir / İlçe','Takip','Sorumlu','İşlem'],rows.map(c=>[btn(esc(c.name),`v12Customer('${c.id}')`),esc(c.phone)+'<br><small>'+esc(c.email)+'</small>',status(c.type),esc([c.city,c.district].filter(Boolean).join(' / ')),fmt(c.follow),esc(profileName(c.assignee)),btn('Düzenle',`editCustomer('${c.id}')`)+btn('Sil',`v12DeleteCustomer('${c.id}')`,'danger')]))};
const v12EditCustomer=editCustomer;editCustomer=function(id='',fromService=false){if(!v12Guard('customers'))return;v12EditCustomer(id,fromService);let c=find('customers',id)||{};$('#modal-form .form-grid').insertAdjacentHTML('beforeend',`${field('company','Firma adı','text',c.company)}${field('city','Şehir','text',c.city)}${field('district','İlçe','text',c.district)}${sel('assignee','Sorumlu personel',optionList(all('profiles').filter(x=>x.active)),c.assignee||currentProfile.id)}`)};
const v12SaveCustomer=saveCustomer;saveCustomer=function(f,id,fromService){if(!v12Guard('customers'))return;const extras=Object.fromEntries(['company','city','district','assignee'].map(k=>[k,val(f,k)])),old=new Set(all('customers').map(x=>x.id));v12SaveCustomer(f,id,fromService);if(byId('modal-form')===f)return;let c=id?find('customers',id):all('customers').find(x=>!old.has(x.id));if(c){Object.assign(c,extras);c.createdAt=c.createdAt||new Date().toISOString();save();if(!fromService)renderApp()}};
